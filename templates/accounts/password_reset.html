{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/signin.css' %}">
</head>
<body class="text-center">
    <form class="form-signin" method="post">
        {% csrf_token %}
        <img class="mb-4" src="https://getbootstrap.com/docs/4.0/assets/brand/bootstrap-solid.svg" alt="" width="72" height="72">
        <h1 class="h3 mb-3 font-weight-normal">Forgot Password</h1>
        <p class="text-muted mb-3">Enter your email address and we'll send you a reset link.</p>

        <label class="sr-only">Email</label>
        <input type="email" name="email" class="form-control" placeholder="Email Address" required autofocus>

        <button class="btn btn-lg btn-primary btn-block mt-3" type="submit">Send Reset Link</button>
        <p class="mt-3"><a href="{% url 'accounts:login' %}">Back to Login</a></p>
        <p class="mt-5 mb-3 text-muted">&copy; 2017-2018</p>
    </form>
</body>
</html>
