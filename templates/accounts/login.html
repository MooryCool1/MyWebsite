{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
  <link rel="stylesheet" href="{% static 'css/signin.css' %}">
</head>

<body class="text-center">
<form class="form-signin" method="post" action="{% url 'accounts:login' %}">
    {% csrf_token %}
    <img class="mb-4" src="https://getbootstrap.com/docs/4.0/assets/brand/bootstrap-solid.svg" alt="" width="72" height="72">
    <h1 class="h3 mb-3 font-weight-normal">Please login</h1>

    <label class="sr-only">Username or Email</label>
    <input type="text" name="credential" class="form-control" placeholder="Username or Email" required autofocus>

    <label class="sr-only">Password</label>
    <input type="password" name="password" class="form-control" placeholder="Password" required>

    {% if error %}
    <div class="alert alert-danger mt-2">{{ error }}</div>
    {% endif %}

    <div class="checkbox mb-3 mt-2">
        <label>
            <input type="checkbox" value="remember-me"> Remember me
        </label>
    </div>

    <button class="btn btn-lg btn-primary btn-block" type="submit">Login</button>
    <p class="mt-3">
        <a href="{% url 'accounts:password_reset' %}">Forgot your password?</a>
    </p>
    <p class="mt-5 mb-3 text-muted">&copy; 2017-2018</p>
</form>
  <script>
    function switchTab(type) {
      var tabs = document.querySelectorAll('#loginTabs button');
      tabs.forEach(function (btn) { btn.classList.remove('active'); });

      if (type === 'username') {
        tabs[0].classList.add('active');
        document.getElementById('field-username').style.display = 'block';
        document.getElementById('field-email').style.display = 'none';
        document.getElementById('input-username').setAttribute('required', 'required');
        document.getElementById('input-email').removeAttribute('required');
      } else {
        tabs[1].classList.add('active');
        document.getElementById('field-username').style.display = 'none';
        document.getElementById('field-email').style.display = 'block';
        document.getElementById('input-email').setAttribute('required', 'required');
        document.getElementById('input-username').removeAttribute('required');
      }

      document.getElementById('login_type').value = type;
    }
  </script>
</body>

</html>
