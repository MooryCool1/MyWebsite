{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/signin.css' %}">
</head>

<body class="text-center">
    <form class="form-signin" method="post" action="{% url 'accounts:signup' %}">
        {% csrf_token %}
        <img class="mb-4" src="https://getbootstrap.com/docs/4.0/assets/brand/bootstrap-solid.svg" alt="" width="72" height="72">
        <h1 class="h3 mb-3 font-weight-normal">Please Sign up</h1>

        <label class="sr-only">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>

        <label class="sr-only">Email</label>
        <input type="email" name="email" class="form-control" placeholder="Email Address" required>

        <label class="sr-only">Password</label>
        <input type="password" name="password1" id="password-field-1" class="form-control" placeholder="Password" required>

        <label class="sr-only">Confirm Password</label>
        <input type="password" name="password2" id="password-field-2" class="form-control" placeholder="Confirm Password" required>

        {% if form.errors %}
        <div class="alert alert-danger mt-2" style="text-align:right;">
            {% for field in form %}
                {% for error in field.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
        {% endif %}

        <div class="checkbox mb-3 mt-2">
            <label>
                <input type="checkbox" onclick="togglePassword()"> Show Password
            </label>
        </div>

        <button class="btn btn-lg btn-primary btn-block" type="submit">Sign up</button>
        <p class="mt-5 mb-3 text-muted">&copy; 2017-2018</p>
    </form>

    <script>
        function togglePassword() {
            var field1 = document.getElementById('password-field-1');
            var field2 = document.getElementById('password-field-2');
            var newType = (field1.type === 'password') ? 'text' : 'password';
            field1.type = newType;
            field2.type = newType;
        }
    </script>
</body>

</html>
