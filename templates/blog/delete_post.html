{% extends 'base.html' %}
{% block content %}
<section class="banner-area relative" id="home">
    <div class="overlay overlay-bg"></div>
    <div class="container">
        <div class="row d-flex align-items-center justify-content-center">
            <div class="about-content blog-header-content col-lg-12">
                <h1 class="text-white">Delete Post</h1>
            </div>
        </div>
    </div>
</section>
<div style="max-width:500px; margin:80px auto; text-align:center;">
    <h3>Are you sure you want to delete the post "{{ post.title }}"?</h3>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background:red; color:white; padding:10px 30px; border:none; cursor:pointer; margin-right:10px;">Yes, Delete</button>
        <a href="{% url 'blog:single' post.pk %}" style="padding:10px 30px; background:#ccc; color:#333;">Cancel</a>
    </form>
</div>
{% endblock %}
